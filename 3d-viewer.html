<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型预览 - LONEFORME</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
        }
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            padding: 0 24px;
            z-index: 100;
        }
        #header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #58a6ff;
        }
        #header .subtitle {
            margin-left: 12px;
            font-size: 13px;
            color: #8b949e;
        }
        #model-count {
            margin-left: 8px;
            font-size: 12px;
            color: #8b949e;
            background: #21262d;
            padding: 2px 8px;
            border-radius: 10px;
        }
        #model-selector {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #model-selector label {
            font-size: 13px;
            color: #8b949e;
        }
        #model-select {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            max-width: 280px;
        }
        #model-select:hover {
            border-color: #58a6ff;
        }
        #canvas-container {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
        }
        #info-panel {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: rgba(22, 27, 34, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px 20px;
            max-width: 320px;
            z-index: 50;
        }
        #info-panel h3 {
            font-size: 14px;
            color: #58a6ff;
            margin-bottom: 8px;
            word-break: break-all;
        }
        #info-panel .meta {
            font-size: 12px;
            color: #8b949e;
            line-height: 1.8;
        }
        #info-panel .meta span {
            color: #c9d1d9;
        }
        #controls-hint {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(22, 27, 34, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 12px;
            color: #8b949e;
            z-index: 50;
        }
        #controls-hint div {
            margin: 4px 0;
        }
        #controls-hint span {
            color: #58a6ff;
            font-weight: 600;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            color: #8b949e;
            z-index: 200;
            text-align: center;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #auto-rotate-btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 8px;
        }
        #auto-rotate-btn:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }
        #auto-rotate-btn.active {
            background: #1f6feb;
            border-color: #1f6feb;
            color: white;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>3D 模型预览</h1>
        <span class="subtitle">LONEFORME · 3D 打印模型库</span>
        <span id="model-count">加载中...</span>
        <div id="model-selector">
            <label for="model-select">选择模型：</label>
            <select id="model-select">
                <option>加载中...</option>
            </select>
            <button id="auto-rotate-btn">自动旋转</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="loading">
        <span class="spinner"></span>加载模型中...
    </div>

    <div id="info-panel">
        <h3 id="model-name">-</h3>
        <div class="meta">
            分类：<span id="model-category">-</span><br>
            大小：<span id="model-size">-</span><br>
            文件：<span id="model-file">-</span>
        </div>
    </div>

    <div id="controls-hint">
        <div><span>左键拖拽</span> 旋转视角</div>
        <div><span>中键拖拽</span> 平移</div>
        <div><span>滚轮</span> 缩放</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';

        // 全局变量
        let allModels = [];
        let currentMesh = null;

        // 场景设置
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        const camera = new THREE.PerspectiveCamera(
            45,
            container.clientWidth / container.clientHeight,
            0.1,
            10000
        );
        camera.position.set(100, 100, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 控制器（拓竹风格操作）
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 2.0;
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE,
            MIDDLE: THREE.MOUSE.PAN,
            RIGHT: THREE.MOUSE.PAN
        };

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight1.position.set(100, 100, 100);
        directionalLight1.castShadow = true;
        scene.add(directionalLight1);

        const directionalLight2 = new THREE.DirectionalLight(0x58a6ff, 0.3);
        directionalLight2.position.set(-100, 50, -100);
        scene.add(directionalLight2);

        // 网格地面
        const gridHelper = new THREE.GridHelper(500, 50, 0x30363d, 0x21262d);
        scene.add(gridHelper);

        const loader = new STLLoader();

        // 格式化文件大小
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        // 加载模型
        function loadModel(model) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('model-name').textContent = model.name;
            document.getElementById('model-category').textContent = model.category;
            document.getElementById('model-size').textContent = formatSize(model.size);
            document.getElementById('model-file').textContent = model.url.split('/').pop();

            loader.load(
                model.url,
                function (geometry) {
                    if (currentMesh) {
                        scene.remove(currentMesh);
                        currentMesh.geometry.dispose();
                        currentMesh.material.dispose();
                    }

                    geometry.computeVertexNormals();

                    const material = new THREE.MeshPhysicalMaterial({
                        color: 0x4a9eff,
                        metalness: 0.1,
                        roughness: 0.4,
                        clearcoat: 0.3,
                        clearcoatRoughness: 0.2,
                        side: THREE.DoubleSide
                    });

                    currentMesh = new THREE.Mesh(geometry, material);
                    currentMesh.castShadow = true;
                    currentMesh.receiveShadow = true;

                    geometry.computeBoundingBox();
                    const center = geometry.boundingBox.getCenter(new THREE.Vector3());
                    const size = geometry.boundingBox.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 100 / maxDim;

                    currentMesh.position.sub(center);
                    currentMesh.scale.setScalar(scale);
                    scene.add(currentMesh);

                    camera.position.set(100, 100, 150);
                    controls.target.set(0, 0, 0);
                    controls.update();

                    document.getElementById('loading').style.display = 'none';
                },
                undefined,
                function (error) {
                    console.error('加载模型失败:', error);
                    document.getElementById('loading').innerHTML = '加载失败：' + error.message;
                }
            );
        }

        // 初始化：加载模型清单
        async function init() {
            try {
                const response = await fetch('models.json');
                const data = await response.json();
                allModels = [];

                const select = document.getElementById('model-select');
                select.innerHTML = '';

                // 按分类分组
                for (const [category, models] of Object.entries(data.categories)) {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = category;
                    for (const model of models) {
                        const option = document.createElement('option');
                        option.value = allModels.length;
                        option.textContent = model.name;
                        optgroup.appendChild(option);
                        allModels.push(model);
                    }
                    select.appendChild(optgroup);
                }

                document.getElementById('model-count').textContent = `共 ${allModels.length} 个模型`;

                // 模型选择事件
                select.addEventListener('change', function (e) {
                    loadModel(allModels[parseInt(e.target.value)]);
                });

                // 自动旋转按钮
                document.getElementById('auto-rotate-btn').addEventListener('click', function () {
                    controls.autoRotate = !controls.autoRotate;
                    this.classList.toggle('active', controls.autoRotate);
                });

                // 加载第一个模型
                if (allModels.length > 0) {
                    select.value = '0';
                    loadModel(allModels[0]);
                }
            } catch (error) {
                console.error('加载模型清单失败:', error);
                document.getElementById('loading').innerHTML = '加载模型清单失败：' + error.message;
            }
        }

        // 窗口大小调整
        window.addEventListener('resize', function () {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 启动
        init();
    </script>
</body>
</html>
