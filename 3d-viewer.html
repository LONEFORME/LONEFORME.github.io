<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型预览 - LONEFORME</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
        }
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            padding: 0 24px;
            z-index: 100;
        }
        #header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #58a6ff;
        }
        #header .subtitle {
            margin-left: 12px;
            font-size: 13px;
            color: #8b949e;
        }
        #model-count {
            margin-left: 8px;
            font-size: 12px;
            color: #8b949e;
            background: #21262d;
            padding: 2px 8px;
            border-radius: 10px;
        }
        #model-selector {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #model-selector label {
            font-size: 13px;
            color: #8b949e;
        }
        #model-select {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            max-width: 280px;
        }
        #model-select:hover {
            border-color: #58a6ff;
        }
        #canvas-container {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
        }
        #info-panel {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: rgba(22, 27, 34, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px 20px;
            max-width: 320px;
            z-index: 50;
        }
        #info-panel h3 {
            font-size: 14px;
            color: #58a6ff;
            margin-bottom: 8px;
            word-break: break-all;
        }
        #info-panel .meta {
            font-size: 12px;
            color: #8b949e;
            line-height: 1.8;
        }
        #info-panel .meta span {
            color: #c9d1d9;
        }
        #controls-hint {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(22, 27, 34, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 12px;
            color: #8b949e;
            z-index: 50;
        }
        #controls-hint div {
            margin: 4px 0;
        }
        #controls-hint span {
            color: #58a6ff;
            font-weight: 600;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            color: #8b949e;
            z-index: 200;
            text-align: center;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .tool-btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 8px;
        }
        .tool-btn:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }
        .tool-btn.active {
            background: #1f6feb;
            border-color: #1f6feb;
            color: white;
        }
        #pick-hint {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 111, 235, 0.95);
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 150;
            display: none;
        }
        body.pick-mode #canvas-container {
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>3D 模型预览</h1>
        <span class="subtitle">LONEFORME · 3D 打印模型库</span>
        <span id="model-count">加载中...</span>
        <div id="model-selector">
            <label for="model-select">选择模型：</label>
            <select id="model-select">
                <option>加载中...</option>
            </select>
            <button id="pick-bottom-btn" class="tool-btn">选择底面</button>
            <button id="flatten-btn" class="tool-btn">平放</button>
            <button id="reset-pos-btn" class="tool-btn">复位</button>
            <button id="auto-rotate-btn" class="tool-btn">自动旋转</button>
        </div>
    </div>

    <div id="pick-hint">点击模型上的一个面，将其设为底面</div>

    <div id="canvas-container"></div>

    <div id="loading">
        <span class="spinner"></span>加载模型中...
    </div>

    <div id="info-panel">
        <h3 id="model-name">-</h3>
        <div class="meta">
            分类：<span id="model-category">-</span><br>
            大小：<span id="model-size">-</span><br>
            文件：<span id="model-file">-</span>
        </div>
    </div>

    <div id="controls-hint">
        <div><span>左键拖拽</span> 旋转视角</div>
        <div><span>中键拖拽</span> 平移</div>
        <div><span>滚轮</span> 缩放</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';

        let allModels = [];
        let currentMesh = null;
        let pickMode = false;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        const camera = new THREE.PerspectiveCamera(
            45,
            container.clientWidth / container.clientHeight,
            0.1,
            10000
        );
        camera.position.set(100, 100, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 2.0;
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE,
            MIDDLE: THREE.MOUSE.PAN,
            RIGHT: THREE.MOUSE.PAN
        };

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight1.position.set(100, 100, 100);
        directionalLight1.castShadow = true;
        directionalLight1.shadow.mapSize.width = 2048;
        directionalLight1.shadow.mapSize.height = 2048;
        directionalLight1.shadow.camera.near = 0.5;
        directionalLight1.shadow.camera.far = 500;
        directionalLight1.shadow.camera.left = -200;
        directionalLight1.shadow.camera.right = 200;
        directionalLight1.shadow.camera.top = 200;
        directionalLight1.shadow.camera.bottom = -200;
        scene.add(directionalLight1);

        const directionalLight2 = new THREE.DirectionalLight(0x58a6ff, 0.3);
        directionalLight2.position.set(-100, 50, -100);
        scene.add(directionalLight2);

        // 透明阴影接收地面
        const shadowPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(500, 500),
            new THREE.ShadowMaterial({ opacity: 0.3 })
        );
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.receiveShadow = true;
        scene.add(shadowPlane);

        const gridHelper = new THREE.GridHelper(500, 50, 0x30363d, 0x21262d);
        scene.add(gridHelper);

        const loader = new STLLoader();
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function centerMesh(mesh) {
            mesh.updateMatrixWorld();
            const box = new THREE.Box3().setFromObject(mesh);
            const center = box.getCenter(new THREE.Vector3());
            mesh.position.x -= center.x;
            mesh.position.z -= center.z;
            mesh.position.y -= box.min.y;
        }

        function resetCamera() {
            camera.position.set(100, 100, 150);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function loadModel(model) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('model-name').textContent = model.name;
            document.getElementById('model-category').textContent = model.category;
            document.getElementById('model-size').textContent = formatSize(model.size);
            document.getElementById('model-file').textContent = model.url.split('/').pop();
            exitPickMode();

            loader.load(
                model.url,
                function (geometry) {
                    if (currentMesh) {
                        scene.remove(currentMesh);
                        currentMesh.geometry.dispose();
                        currentMesh.material.dispose();
                    }

                    geometry.computeVertexNormals();

                    const material = new THREE.MeshPhysicalMaterial({
                        color: 0x4a9eff,
                        metalness: 0.1,
                        roughness: 0.4,
                        clearcoat: 0.3,
                        clearcoatRoughness: 0.2,
                        side: THREE.DoubleSide
                    });

                    currentMesh = new THREE.Mesh(geometry, material);
                    currentMesh.castShadow = true;
                    currentMesh.receiveShadow = true;

                    geometry.computeBoundingBox();
                    const size = geometry.boundingBox.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 100 / maxDim;

                    currentMesh.scale.setScalar(scale);
                    centerMesh(currentMesh);
                    scene.add(currentMesh);

                    resetCamera();
                    document.getElementById('loading').style.display = 'none';
                },
                undefined,
                function (error) {
                    console.error('加载模型失败:', error);
                    document.getElementById('loading').innerHTML = '加载失败：' + error.message;
                }
            );
        }

        // 平放模型：找到最薄的维度，将其旋转到 Y 轴
        function flattenModel() {
            if (!currentMesh) return;

            const geometry = currentMesh.geometry;
            geometry.computeBoundingBox();
            const size = geometry.boundingBox.getSize(new THREE.Vector3());

            const dims = [
                { axis: 'x', value: size.x },
                { axis: 'y', value: size.y },
                { axis: 'z', value: size.z }
            ];
            dims.sort((a, b) => a.value - b.value);
            const minAxis = dims[0].axis;

            let rotated = false;
            if (minAxis === 'x') {
                geometry.rotateZ(Math.PI / 2);
                rotated = true;
            } else if (minAxis === 'z') {
                geometry.rotateX(Math.PI / 2);
                rotated = true;
            }

            if (rotated) {
                geometry.computeVertexNormals();
                geometry.computeBoundingBox();
                centerMesh(currentMesh);
                resetCamera();
            }
        }

        // 进入选择底面模式
        function enterPickMode() {
            if (!currentMesh) return;
            pickMode = true;
            controls.enabled = false;
            document.body.classList.add('pick-mode');
            document.getElementById('pick-hint').style.display = 'block';
            document.getElementById('pick-bottom-btn').classList.add('active');
        }

        function exitPickMode() {
            pickMode = false;
            controls.enabled = true;
            document.body.classList.remove('pick-mode');
            document.getElementById('pick-hint').style.display = 'none';
            document.getElementById('pick-bottom-btn').classList.remove('active');
        }

        // 处理鼠标点击，选择底面
        function onCanvasClick(event) {
            if (!pickMode || !currentMesh) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(currentMesh, false);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const geometry = currentMesh.geometry;
                const faceIndex = hit.faceIndex;

                // 从几何体中获取该面的三个顶点，计算法向量
                const positions = geometry.attributes.position;
                const v0 = new THREE.Vector3().fromBufferAttribute(positions, faceIndex * 3);
                const v1 = new THREE.Vector3().fromBufferAttribute(positions, faceIndex * 3 + 1);
                const v2 = new THREE.Vector3().fromBufferAttribute(positions, faceIndex * 3 + 2);

                const edge1 = new THREE.Vector3().subVectors(v1, v0);
                const edge2 = new THREE.Vector3().subVectors(v2, v0);
                const normal = new THREE.Vector3().crossVectors(edge1, edge2).normalize();

                // 目标方向：朝下 (0, -1, 0)
                const target = new THREE.Vector3(0, -1, 0);

                // 计算旋转四元数，将 normal 转到 target
                const quaternion = new THREE.Quaternion().setFromUnitVectors(normal, target);
                geometry.applyQuaternion(quaternion);

                geometry.computeVertexNormals();
                geometry.computeBoundingBox();
                centerMesh(currentMesh);
                resetCamera();

                exitPickMode();
            }
        }

        async function init() {
            try {
                const response = await fetch('models.json');
                const data = await response.json();
                allModels = [];

                const select = document.getElementById('model-select');
                select.innerHTML = '';

                for (const [category, models] of Object.entries(data.categories)) {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = category;
                    for (const model of models) {
                        const option = document.createElement('option');
                        option.value = allModels.length;
                        option.textContent = model.name;
                        optgroup.appendChild(option);
                        allModels.push(model);
                    }
                    select.appendChild(optgroup);
                }

                document.getElementById('model-count').textContent = `共 ${allModels.length} 个模型`;

                select.addEventListener('change', function (e) {
                    loadModel(allModels[parseInt(e.target.value)]);
                });

                // 选择底面按钮
                document.getElementById('pick-bottom-btn').addEventListener('click', function () {
                    if (pickMode) {
                        exitPickMode();
                    } else {
                        enterPickMode();
                    }
                });

                // 平放按钮
                document.getElementById('flatten-btn').addEventListener('click', flattenModel);

                // 复位按钮
                document.getElementById('reset-pos-btn').addEventListener('click', function () {
                    if (currentMesh) {
                        centerMesh(currentMesh);
                        resetCamera();
                    }
                });

                // 自动旋转按钮
                document.getElementById('auto-rotate-btn').addEventListener('click', function () {
                    controls.autoRotate = !controls.autoRotate;
                    this.classList.toggle('active', controls.autoRotate);
                });

                // 画布点击事件（用于选择底面）
                renderer.domElement.addEventListener('click', onCanvasClick);

                // ESC 退出选择模式
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && pickMode) {
                        exitPickMode();
                    }
                });

                if (allModels.length > 0) {
                    select.value = '0';
                    loadModel(allModels[0]);
                }
            } catch (error) {
                console.error('加载模型清单失败:', error);
                document.getElementById('loading').innerHTML = '加载模型清单失败：' + error.message;
            }
        }

        window.addEventListener('resize', function () {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        init();
    </script>
</body>
</html>
