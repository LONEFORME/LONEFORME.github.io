<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型预览 - LONEFORME</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
        }
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            padding: 0 24px;
            z-index: 100;
        }
        #header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #58a6ff;
        }
        #header .subtitle {
            margin-left: 12px;
            font-size: 13px;
            color: #8b949e;
        }
        #model-selector {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #model-selector label {
            font-size: 13px;
            color: #8b949e;
        }
        #model-select {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }
        #model-select:hover {
            border-color: #58a6ff;
        }
        #canvas-container {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
        }
        #info-panel {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: rgba(22, 27, 34, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px 20px;
            max-width: 320px;
            z-index: 50;
        }
        #info-panel h3 {
            font-size: 14px;
            color: #58a6ff;
            margin-bottom: 8px;
        }
        #info-panel p {
            font-size: 12px;
            color: #8b949e;
            line-height: 1.6;
        }
        #controls-hint {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(22, 27, 34, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 12px;
            color: #8b949e;
            z-index: 50;
        }
        #controls-hint div {
            margin: 4px 0;
        }
        #controls-hint span {
            color: #58a6ff;
            font-weight: 600;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            color: #8b949e;
            z-index: 200;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #auto-rotate-btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 8px;
        }
        #auto-rotate-btn:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }
        #auto-rotate-btn.active {
            background: #1f6feb;
            border-color: #1f6feb;
            color: white;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>3D 模型预览</h1>
        <span class="subtitle">LONEFORME · 3D 打印模型库</span>
        <div id="model-selector">
            <label for="model-select">选择模型：</label>
            <select id="model-select">
                <option value="baohuzhao">飞控保护罩</option>
                <option value="shexiangtou">摄像头支架</option>
                <option value="xiaochediban">小车底板</option>
                <option value="jiguangzhijia">激光传感器支架</option>
            </select>
            <button id="auto-rotate-btn" class="active">自动旋转</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="loading">
        <span class="spinner"></span>加载模型中...
    </div>

    <div id="info-panel">
        <h3 id="model-name">飞控保护罩</h3>
        <p id="model-desc">无人机飞控板保护结构，用于保护飞控板免受碰撞损坏。</p>
    </div>

    <div id="controls-hint">
        <div><span>左键拖拽</span> 旋转视角</div>
        <div><span>中键拖拽</span> 平移</div>
        <div><span>滚轮</span> 缩放</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';

        // 模型配置
        const models = {
            baohuzhao: {
                name: '飞控保护罩',
                desc: '无人机飞控板保护结构，用于保护飞控板免受碰撞损坏。',
                url: 'models/baohuzhao.stl'
            },
            shexiangtou: {
                name: '摄像头支架',
                desc: '35.9mm 摄像头安装支架，适用于无人机视觉系统。',
                url: 'models/shexiangtou.stl'
            },
            xiaochediban: {
                name: '小车底板',
                desc: '二轮小车底盘扩展板，集成电机安装位和扩展接口。',
                url: 'models/xiaochediban.stl'
            },
            jiguangzhijia: {
                name: '激光传感器支架',
                desc: '激光定高传感器固定架，用于无人机高度测量。',
                url: 'models/jiguangzhijia.stl'
            }
        };

        // 场景设置
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        // 相机
        const camera = new THREE.PerspectiveCamera(
            45,
            container.clientWidth / container.clientHeight,
            0.1,
            10000
        );
        camera.position.set(100, 100, 150);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 控制器（拓竹风格操作：左键旋转、中键平移、滚轮缩放）
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.0;
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE,
            MIDDLE: THREE.MOUSE.PAN,
            RIGHT: THREE.MOUSE.PAN
        };

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight1.position.set(100, 100, 100);
        directionalLight1.castShadow = true;
        scene.add(directionalLight1);

        const directionalLight2 = new THREE.DirectionalLight(0x58a6ff, 0.3);
        directionalLight2.position.set(-100, 50, -100);
        scene.add(directionalLight2);

        // 网格地面
        const gridHelper = new THREE.GridHelper(500, 50, 0x30363d, 0x21262d);
        scene.add(gridHelper);

        // 模型组
        let currentMesh = null;
        const loader = new STLLoader();

        function loadModel(key) {
            const model = models[key];
            document.getElementById('loading').style.display = 'block';
            document.getElementById('model-name').textContent = model.name;
            document.getElementById('model-desc').textContent = model.desc;

            loader.load(
                model.url,
                function (geometry) {
                    // 移除旧模型
                    if (currentMesh) {
                        scene.remove(currentMesh);
                        currentMesh.geometry.dispose();
                        currentMesh.material.dispose();
                    }

                    // 计算法向量
                    geometry.computeVertexNormals();

                    // 材质
                    const material = new THREE.MeshPhysicalMaterial({
                        color: 0x4a9eff,
                        metalness: 0.1,
                        roughness: 0.4,
                        clearcoat: 0.3,
                        clearcoatRoughness: 0.2,
                        side: THREE.DoubleSide
                    });

                    currentMesh = new THREE.Mesh(geometry, material);
                    currentMesh.castShadow = true;
                    currentMesh.receiveShadow = true;

                    // 居中并缩放
                    geometry.computeBoundingBox();
                    const center = geometry.boundingBox.getCenter(new THREE.Vector3());
                    const size = geometry.boundingBox.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 100 / maxDim;

                    currentMesh.position.sub(center);
                    currentMesh.scale.setScalar(scale);

                    scene.add(currentMesh);

                    // 重置相机
                    camera.position.set(100, 100, 150);
                    controls.target.set(0, 0, 0);
                    controls.update();

                    document.getElementById('loading').style.display = 'none';
                },
                function (xhr) {
                    // 加载进度
                },
                function (error) {
                    console.error('加载模型失败:', error);
                    document.getElementById('loading').innerHTML = '加载失败，请检查网络连接';
                }
            );
        }

        // 模型选择
        document.getElementById('model-select').addEventListener('change', function (e) {
            loadModel(e.target.value);
        });

        // 自动旋转按钮
        const autoRotateBtn = document.getElementById('auto-rotate-btn');
        autoRotateBtn.addEventListener('click', function () {
            controls.autoRotate = !controls.autoRotate;
            autoRotateBtn.classList.toggle('active', controls.autoRotate);
        });

        // 窗口大小调整
        window.addEventListener('resize', function () {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 初始加载
        loadModel('baohuzhao');
    </script>
</body>
</html>
