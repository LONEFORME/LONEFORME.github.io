<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.description }}">
  <meta name="keywords" content="ROS2,机器人,激光雷达,SLAM,嵌入式,Linux,LONEFORME">
  <meta name="author" content="LONEFORME">
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }} | {{ site.title }}">
  <meta name="twitter:description" content="{{ site.description }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/css/custom.css" | relative_url }}?v={{ site.time | date: '%s' }}">
  {% seo %}
</head>
<body>
  <!-- 顶部阅读进度条 -->
  <div id="readingProgressBar" class="reading-progress-bar"></div>

  <!-- 移动端遮罩层 -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

  <div class="wrapper">
    <aside class="sidebar" id="siteSidebar">
      <div class="sidebar-header">
        <a href="{{ "/" | relative_url }}" class="site-title">
          <span class="site-logo-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </span>
          <span class="title-accent">旧梦如常</span>
        </a>
        <p class="site-desc">{{ site.description }}</p>
      </div>
      <nav class="sidebar-nav" aria-label="主导航">
        <a href="{{ "/" | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">
          <svg class="nav-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>首页</span>
        </a>
        <a href="{{ "/projects" | relative_url }}" class="nav-link {% if page.url contains '/projects' %}active{% endif %}">
          <svg class="nav-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          <span>项目</span>
        </a>
        <a href="{{ "/docs" | relative_url }}" class="nav-link {% if page.url contains '/docs' %}active{% endif %}">
          <svg class="nav-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6 6h10"></path><path d="M6 10h10"></path></svg>
          <span>文档</span>
        </a>
        <a href="{{ "/news" | relative_url }}" class="nav-link {% if page.url contains '/news' %}active{% endif %}">
          <svg class="nav-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8"></path><path d="M15 18h-5"></path><path d="M10 6h8v4h-8V6Z"></path></svg>
          <span>热点</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="theme-toggle" onclick="toggleTheme()" title="切换主题">
          <span class="theme-icon" id="themeIcon">
            <svg class="theme-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
          </span>
          <span class="theme-label" id="themeLabel">暗色模式</span>
        </div>
        <div class="contact-info">
          <div class="contact-row">
            <svg class="contact-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
            <span>lonefasf@qq.com</span>
          </div>
          <div class="contact-row">
            <svg class="contact-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <span>QQ: 2641881852</span>
          </div>
        </div>
        <a href="https://github.com/LONEFORME" target="_blank" class="github-link" rel="noopener">
          <svg class="contact-svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          <span>GitHub →</span>
        </a>
        <a href="https://loneforme.github.io" target="_blank" class="github-link" rel="noopener">
          <svg class="contact-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" x2="22" y1="12" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          <span>loneforme.github.io</span>
        </a>
      </div>
    </aside>
    <main class="content">
      <!-- 移动端顶部快捷条 -->
      <div class="mobile-topbar">
        <button class="mobile-menu-btn" onclick="toggleSidebar(true)" aria-label="打开菜单">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg>
          <span>菜单</span>
        </button>
        <span class="mobile-topbar-title">旧梦如常</span>
        <button class="mobile-theme-btn" onclick="toggleTheme()" aria-label="切换主题" id="mobileThemeIcon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        </button>
      </div>

      <div class="content-inner">
        {{ content }}
      </div>
      <footer class="site-footer">
        <span>&copy; {{ site.time | date: '%Y' }} {{ site.title }} · 探索嵌入式与智能机器人</span>
        <a href="https://github.com/LONEFORME" target="_blank" rel="noopener">GitHub (@LONEFORME)</a>
      </footer>
    </main>
  </div>

  <!-- 回到顶部悬浮按钮 -->
  <button class="back-to-top" id="backToTop" onclick="scrollToTop()" title="回到顶部" aria-label="回到顶部">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
  </button>

  <script>
    /* --- 主题模式初始化与切换 --- */
    var moonSvg = '<svg class="theme-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>';
    var sunSvg = '<svg class="theme-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>';

    (function() {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.removeAttribute('data-theme');
        updateThemeUI('dark');
      } else if (saved === 'light' || (!saved && !prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'light');
        updateThemeUI('light');
      }
    })();

    function updateThemeUI(theme) {
      var icon = document.getElementById('themeIcon');
      var label = document.getElementById('themeLabel');
      var mobileIcon = document.getElementById('mobileThemeIcon');
      if (theme === 'light') {
        if (icon) icon.innerHTML = sunSvg;
        if (label) label.textContent = '亮色模式';
        if (mobileIcon) mobileIcon.innerHTML = sunSvg;
      } else {
        if (icon) icon.innerHTML = moonSvg;
        if (label) label.textContent = '暗色模式';
        if (mobileIcon) mobileIcon.innerHTML = moonSvg;
      }
    }

    function toggleTheme() {
      var html = document.documentElement;
      if (html.getAttribute('data-theme') === 'light') {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
        updateThemeUI('dark');
      } else {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        updateThemeUI('light');
      }
    }

    /* --- 移动端侧边栏切换 --- */
    function toggleSidebar(show) {
      var sidebar = document.getElementById('siteSidebar');
      var overlay = document.getElementById('sidebarOverlay');
      if (show) {
        sidebar.classList.add('open');
        overlay.classList.add('active');
      } else {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
      }
    }

    /* --- 阅读进度条与回到顶部 --- */
    window.addEventListener('scroll', function() {
      var winScroll = document.documentElement.scrollTop || document.body.scrollTop;
      var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      var scrolled = (winScroll / height) * 100;
      var bar = document.getElementById('readingProgressBar');
      if (bar) bar.style.width = scrolled + '%';

      var btt = document.getElementById('backToTop');
      if (btt) {
        if (winScroll > 280) {
          btt.classList.add('visible');
        } else {
          btt.classList.remove('visible');
        }
      }
    });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* --- 代码块一键复制增强 --- */
    document.addEventListener('DOMContentLoaded', function() {
      var pres = document.querySelectorAll('.content-inner pre');
      pres.forEach(function(pre) {
        var wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        // 创建代码块顶部栏
        var header = document.createElement('div');
        header.className = 'code-block-header';
        header.innerHTML = '<span class="code-dots"><i></i><i></i><i></i></span>';

        var copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.type = 'button';
        copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg> 复制';
        copyBtn.addEventListener('click', function() {
          var code = pre.querySelector('code');
          var text = code ? code.innerText : pre.innerText;
          navigator.clipboard.writeText(text).then(function() {
            copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> 已复制';
            copyBtn.classList.add('copied');
            setTimeout(function() {
              copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg> 复制';
              copyBtn.classList.remove('copied');
            }, 2000);
          }).catch(function() {
            copyBtn.textContent = '失败 ✗';
          });
        });

        header.appendChild(copyBtn);
        wrapper.insertBefore(header, pre);
      });
    });

    /* --- 新闻热点悬浮简述气泡系统 (News Hover Preview) --- */
    document.addEventListener('DOMContentLoaded', function() {
      var popover = document.createElement('div');
      popover.className = 'news-hover-popover';
      popover.id = 'newsHoverPopover';
      popover.innerHTML = '<div class="popover-header"><span class="popover-source-badge" id="popoverSource"></span><span class="popover-date" id="popoverDate"></span></div>' +
                          '<h4 class="popover-title" id="popoverTitle"></h4>' +
                          '<p class="popover-summary" id="popoverSummary"></p>' +
                          '<div class="popover-footer"><span class="popover-hint">💡 来源可溯 · 点击直接跳转全文</span><span>阅读全文 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg></span></div>';
      document.body.appendChild(popover);

      var hideTimeout = null;

      function handleMouseEnter(e) {
        var item = e.currentTarget;
        var summary = item.getAttribute('data-summary') || item.getAttribute('data-detail') || (item.querySelector('.news-item-summary') ? item.querySelector('.news-item-summary').innerText : '');
        var title = item.getAttribute('data-title') || (item.querySelector('.news-item-title, .hero-featured-title, .hero-sub-title') ? item.querySelector('.news-item-title, .hero-featured-title, .hero-sub-title').innerText : '');
        var source = item.getAttribute('data-source') || (item.querySelector('.source-badge') ? item.querySelector('.source-badge').innerText : '权威资讯');
        var date = item.getAttribute('data-date') || (item.querySelector('.news-item-date, .hero-featured-date') ? item.querySelector('.news-item-date, .hero-featured-date').innerText : '');

        if (!summary && !title) return;

        clearTimeout(hideTimeout);
        document.getElementById('popoverSource').textContent = source;
        document.getElementById('popoverDate').textContent = date;
        document.getElementById('popoverTitle').textContent = title;
        document.getElementById('popoverSummary').textContent = summary || '点击直接阅读本篇新闻最新深度报道与全文。';

        positionPopover(e);
        popover.classList.add('visible');
      }

      function handleMouseMove(e) {
        if (popover.classList.contains('visible')) {
          positionPopover(e);
        }
      }

      function handleMouseLeave() {
        hideTimeout = setTimeout(function() {
          popover.classList.remove('visible');
        }, 60);
      }

      function positionPopover(e) {
        var margin = 16;
        var popWidth = popover.offsetWidth || 340;
        var popHeight = popover.offsetHeight || 150;
        var x = e.clientX + 16;
        var y = e.clientY + 16;

        if (x + popWidth > window.innerWidth - margin) {
          x = e.clientX - popWidth - 16;
        }
        if (y + popHeight > window.innerHeight - margin) {
          y = e.clientY - popHeight - 16;
        }
        if (x < margin) x = margin;
        if (y < margin) y = margin;

        popover.style.left = x + 'px';
        popover.style.top = y + 'px';
      }

      function attachNewsListeners() {
        var targets = document.querySelectorAll('.news-item, .hero-featured-card, .hero-sub-card');
        targets.forEach(function(el) {
          el.removeEventListener('mouseenter', handleMouseEnter);
          el.removeEventListener('mousemove', handleMouseMove);
          el.removeEventListener('mouseleave', handleMouseLeave);

          el.addEventListener('mouseenter', handleMouseEnter);
          el.addEventListener('mousemove', handleMouseMove);
          el.addEventListener('mouseleave', handleMouseLeave);
        });
      }

      attachNewsListeners();

      var observer = new MutationObserver(attachNewsListeners);
      var container = document.querySelector('.content-inner');
      if (container) {
        observer.observe(container, { childList: true, subtree: true });
      }
    });

    /* --- 新闻频道 Tab 切换与即时过滤系统 --- */
    function filterNewsChannel(channel, btn) {
      var btns = document.querySelectorAll('.channel-btn');
      btns.forEach(function(b) { b.classList.remove('active'); });
      if (btn) btn.classList.add('active');

      var categories = document.querySelectorAll('.news-category');
      var items = document.querySelectorAll('.news-item');

      if (channel === 'all' || channel === 'source') {
        categories.forEach(function(cat) { cat.style.display = 'block'; });
        items.forEach(function(it) { it.style.display = 'flex'; });
        return;
      }

      categories.forEach(function(cat) {
        var catItems = cat.querySelectorAll('.news-item');
        var visibleCount = 0;
        catItems.forEach(function(it) {
          var itCat = it.getAttribute('data-cat') || '';
          if (itCat === channel || itCat.indexOf(channel) !== -1) {
            it.style.display = 'flex';
            visibleCount++;
          } else {
            it.style.display = 'none';
          }
        });
        if (visibleCount > 0) {
          cat.style.display = 'block';
        } else {
          cat.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
