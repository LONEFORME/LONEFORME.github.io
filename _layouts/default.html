  <!-- 主题防闪烁 (FOUC)：在 CSS 应用与首屏绘制前同步设置 data-theme，避免先暗后亮的闪烁 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        var metaTheme = document.getElementById('metaThemeColor');
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          if (metaTheme) metaTheme.setAttribute('content', '#f0f2f5');
        } else {
          document.documentElement.removeAttribute('data-theme');
          if (metaTheme) metaTheme.setAttribute('content', '#080c14');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ "/assets/css/custom.css" | relative_url }}?v={{ site.time | date: '%s' }}">
  {% seo %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ "/atom.xml" | relative_url }}"/>

  <!-- KaTeX 数学公式支持 (异步预取，零渲染阻塞) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>

  <!-- Mermaid 流程图与拓扑图引擎 -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
    mermaid.initialize({
      startOnLoad: true,
      theme: isDark ? 'dark' : 'default',
      securityLevel: 'loose'
    });
  </script>

  <!-- 文档长文全屏自适应充满布局（消除任何单侧大留白） -->
  <style>
    .layout-read .content-body-wrap {
      display: flex !important;
      align-items: flex-start !important;
      gap: 40px !important;
      padding: 36px 48px 48px 48px !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      box-sizing: border-box !important;
    }
    .layout-read .content-inner {
      flex: 1 1 auto !important;
      min-width: 0 !important;
      max-width: none !important;
      width: auto !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #doc-toc {
      position: sticky !important;
      top: 96px !important;
      width: 240px !important;
      flex-shrink: 0 !important;
      margin-left: auto !important;
      max-height: calc(100vh - 130px) !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      padding: 18px 16px !important;
      border-radius: 14px !important;
      background: rgba(13, 20, 26, 0.78) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border: 1px solid var(--color-border) !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15) !important;
      box-sizing: border-box !important;
      display: block !important;
    }
    [data-theme="light"] #doc-toc {
      background: rgba(255, 255, 255, 0.92) !important;
      border-color: rgba(0, 0, 0, 0.08) !important;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06) !important;
    }
    @media (max-width: 1200px) {
      #doc-toc { display: none !important; }
      .layout-read .content-body-wrap { padding: 28px 24px !important; }
    }
  </style>

</head>

  <script>
    /* --- 主题模式初始化与切换 --- */
    var moonSvg = '<svg class="theme-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>';
    var sunSvg = '<svg class="theme-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>';

    (function() {
      // 主题属性已由 <head> 内联 early-init 在首屏绘制前设置，此处仅同步切换按钮的图标与文字
      var isLight = document.documentElement.getAttribute('data-theme') === 'light';
      updateThemeUI(isLight ? 'light' : 'dark');
    })();

    function updateThemeUI(theme) {
      var icon = document.getElementById('themeIcon');
      var label = document.getElementById('themeLabel');
      var mobileIcon = document.getElementById('mobileThemeIcon');
      var metaTheme = document.getElementById('metaThemeColor');
      if (theme === 'light') {
        if (icon) icon.innerHTML = sunSvg;
        if (label) label.textContent = '亮色模式';
        if (mobileIcon) mobileIcon.innerHTML = sunSvg;
        if (metaTheme) metaTheme.setAttribute('content', '#f0f2f5');
      } else {
        if (icon) icon.innerHTML = moonSvg;
        if (label) label.textContent = '暗色模式';
        if (mobileIcon) mobileIcon.innerHTML = moonSvg;
        if (metaTheme) metaTheme.setAttribute('content', '#080c14');
      }
    }

    function toggleTheme() {
      var html = document.documentElement;
      if (html.getAttribute('data-theme') === 'light') {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
        updateThemeUI('dark');
      } else {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        updateThemeUI('light');
      }
    }

    /* --- 移动端侧边栏切换 --- */
    function toggleSidebar(show) {
      var sidebar = document.getElementById('siteSidebar');
      var overlay = document.getElementById('sidebarOverlay');
      if (show) {
        sidebar.classList.add('open');
        overlay.classList.add('active');
      } else {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
      }
    }

    /* --- 阅读进度条与回到顶部 --- */
    window.addEventListener('scroll', function() {
      var winScroll = document.documentElement.scrollTop || document.body.scrollTop;
      var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      var scrolled = (winScroll / height) * 100;
      var bar = document.getElementById('readingProgressBar');
      if (bar) bar.style.width = scrolled + '%';

      var btt = document.getElementById('backToTop');
      if (btt) {
        if (winScroll > 280) {
          btt.classList.add('visible');
        } else {
          btt.classList.remove('visible');
        }
      }
    });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* --- 代码块一键复制增强 --- */
    document.addEventListener('DOMContentLoaded', function() {
      var pres = document.querySelectorAll('.content-inner pre');
      pres.forEach(function(pre) {
        var wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        // 创建代码块顶部栏
        var header = document.createElement('div');
        header.className = 'code-block-header';
        header.innerHTML = '<span class="code-dots"><i></i><i></i><i></i></span>';

        var copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.type = 'button';
        copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg> 复制';
        copyBtn.addEventListener('click', function() {
          var code = pre.querySelector('code');
          var text = code ? code.innerText : pre.innerText;
          navigator.clipboard.writeText(text).then(function() {
            copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> 已复制';
            copyBtn.classList.add('copied');
            setTimeout(function() {
              copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg> 复制';
              copyBtn.classList.remove('copied');
            }, 2000);
          }).catch(function() {
            copyBtn.textContent = '失败 ✗';
          });
        });

        header.appendChild(copyBtn);
        wrapper.insertBefore(header, pre);
      });
    });

    /* --- 新闻热点悬浮简述气泡系统 (News Hover Preview) --- */
    document.addEventListener('DOMContentLoaded', function() {
      var popover = document.createElement('div');
      popover.className = 'news-hover-popover';
      popover.id = 'newsHoverPopover';
      popover.innerHTML = '<div class="popover-header"><span class="popover-source-badge" id="popoverSource"></span><span class="popover-date" id="popoverDate"></span></div>' +
                          '<h4 class="popover-title" id="popoverTitle"></h4>' +
                          '<p class="popover-summary" id="popoverSummary"></p>' +
                          '<div class="popover-footer"><span class="popover-hint">💡 来源可溯 · 点击直接跳转全文</span><span>阅读全文 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg></span></div>';
      document.body.appendChild(popover);

      var hideTimeout = null;

      function handleMouseEnter(e, item) {
        var summary = item.getAttribute('data-summary') || item.getAttribute('data-detail') || (item.querySelector('.news-item-summary') ? item.querySelector('.news-item-summary').innerText : '');
        var title = item.getAttribute('data-title') || (item.querySelector('.news-item-title, .hero-featured-title, .hero-sub-title') ? item.querySelector('.news-item-title, .hero-featured-title, .hero-sub-title').innerText : '');
        var source = item.getAttribute('data-source') || (item.querySelector('.source-badge') ? item.querySelector('.source-badge').innerText : '权威资讯');
        var date = item.getAttribute('data-date') || (item.querySelector('.news-item-date, .hero-featured-date') ? item.querySelector('.news-item-date, .hero-featured-date').innerText : '');

        if (!summary && !title) return;

        clearTimeout(hideTimeout);
        document.getElementById('popoverSource').textContent = source;
        document.getElementById('popoverDate').textContent = date;
        document.getElementById('popoverTitle').textContent = title;
        document.getElementById('popoverSummary').textContent = summary || '点击直接阅读本篇新闻最新深度报道与全文。';

        positionPopover(e);
        popover.classList.add('visible');
      }

      function handleMouseLeave() {
        hideTimeout = setTimeout(function() {
          popover.classList.remove('visible');
        }, 60);
      }

      function positionPopover(e) {
        var margin = 16;
        var popWidth = popover.offsetWidth || 340;
        var popHeight = popover.offsetHeight || 150;
        var x = e.clientX + 16;
        var y = e.clientY + 16;

        if (x + popWidth > window.innerWidth - margin) {
          x = e.clientX - popWidth - 16;
        }
        if (y + popHeight > window.innerHeight - margin) {
          y = e.clientY - popHeight - 16;
        }
        if (x < margin) x = margin;
        if (y < margin) y = margin;

        popover.style.left = x + 'px';
        popover.style.top = y + 'px';
      }

      /* 事件委托：动态增删的卡片无需重新绑定（替代 MutationObserver） */
      var HOVER_SELECTOR = '.news-item, .hero-featured-card, .hero-sub-card';

      document.addEventListener('mouseover', function(e) {
        var item = e.target.closest ? e.target.closest(HOVER_SELECTOR) : null;
        if (!item || popover.contains(e.target)) return;
        var from = e.relatedTarget;
        if (from && from.closest && item.contains(from)) return;
        handleMouseEnter(e, item);
      });

      document.addEventListener('mouseout', function(e) {
        var item = e.target.closest ? e.target.closest(HOVER_SELECTOR) : null;
        if (!item || popover.contains(e.target)) return;
        var to = e.relatedTarget;
        if (to && to.closest && item.contains(to)) return;
        handleMouseLeave();
      });

      document.addEventListener('mousemove', function(e) {
        if (!popover.classList.contains('visible') || popover.contains(e.target)) return;
        var item = e.target.closest ? e.target.closest(HOVER_SELECTOR) : null;
        if (item) positionPopover(e);
      });
    });

    /* --- 新闻频道 Tab 切换与即时过滤系统 --- */
    function filterNewsChannel(channel, btn) {
      var btns = document.querySelectorAll('.channel-btn');
      btns.forEach(function(b) {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      if (btn) {
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
      }

      var categories = document.querySelectorAll('.news-category');
      var items = document.querySelectorAll('.news-item');

      if (channel === 'all' || channel === 'source') {
        categories.forEach(function(cat) { cat.style.display = 'block'; });
        items.forEach(function(it) { it.style.display = 'grid'; });
      } else {
        categories.forEach(function(cat) {
          var catItems = cat.querySelectorAll('.news-item');
          var visibleCount = 0;
          catItems.forEach(function(it) {
            var itCat = it.getAttribute('data-cat') || '';
            if (itCat === channel || itCat.indexOf(channel) !== -1) {
              it.style.display = 'grid';
              visibleCount++;
            } else {
              it.style.display = 'none';
            }
          });
          if (visibleCount > 0) {
            cat.style.display = 'block';
          } else {
            cat.style.display = 'none';
          }
        });
      }

      if (typeof restoreNewsCollapse === 'function') {
        restoreNewsCollapse();
      } else if (typeof applyNewsCollapse === 'function') {
        applyNewsCollapse(false);
      }
    }
  </script>

  <!-- 全局搜索弹窗 (Modal) -->
  <div class="search-modal-backdrop" id="searchModal" onclick="handleSearchBackdropClick(event)">
    <div class="search-modal-panel">
      <div class="search-modal-header">
        <svg class="search-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-modal-input" placeholder="搜索项目、文档、SLAM、RDK X5、硬件参数..." autocomplete="off">
        <button type="button" class="search-input-clear" id="searchClearBtn" onclick="clearSearchInput()" aria-label="清空输入" title="清空">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <button type="button" class="search-modal-close" onclick="closeSearchModal()" aria-label="关闭搜索">Esc</button>
      </div>
      <div class="search-results-box" id="searchResults"></div>
      <div class="search-modal-footer">
        <span><kbd>↑</kbd> <kbd>↓</kbd> 切换选项</span>
        <span><kbd>Enter</kbd> 跳转</span>
        <span><kbd>Esc</kbd> 退出</span>
      </div>
    </div>
  </div>

  <script>
    /* --- 全站客户端秒级搜索 --- */
    var searchIndex = null;
    var searchSelectedIndex = -1;

    function getSearchInitialHtml() {
      return '<div class="search-chips-box">' +
             '  <div class="search-chips-title">' +
             '    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>' +
             '    <span>推荐快速检索：</span>' +
             '  </div>' +
             '  <div class="search-chips-grid">' +
             '    <button type="button" class="search-chip-btn" onclick="applySearchTag(\'凌霄飞控\')">⚡ 凌霄飞控</button>' +
             '    <button type="button" class="search-chip-btn" onclick="applySearchTag(\'地瓜派 RDK X5\')">🛡️ 地瓜派 RDK X5</button>' +
             '    <button type="button" class="search-chip-btn" onclick="applySearchTag(\'FAST-LIO2\')">🤖 FAST-LIO2</button>' +
             '    <button type="button" class="search-chip-btn" onclick="applySearchTag(\'锡月\')">🛰️ 锡月巡航</button>' +
             '    <button type="button" class="search-chip-btn" onclick="applySearchTag(\'镭神 N10P\')">📡 镭神 N10P</button>' +
             '    <button type="button" class="search-chip-btn" onclick="applySearchTag(\'指纹\')">🔐 半导体指纹</button>' +
             '    <button type="button" class="search-chip-btn" onclick="applySearchTag(\'OpenCV\')">👁️ OpenCV 视觉</button>' +
             '    <button type="button" class="search-chip-btn" onclick="applySearchTag(\'树莓派\')">🍓 树莓派 4B</button>' +
             '    <button type="button" class="search-chip-btn" onclick="applySearchTag(\'演示稿\')">📊 答辩演示稿</button>' +
             '  </div>' +
             '</div>';
    }

    function toggleClearBtn(show) {
      var btn = document.getElementById('searchClearBtn');
      if (btn) {
        if (show) btn.classList.add('visible');
        else btn.classList.remove('visible');
      }
    }

    function applySearchTag(tag) {
      var input = document.getElementById('searchInput');
      if (!input) return;
      input.value = tag;
      input.focus();
      toggleClearBtn(true);
      performSearch(tag);
    }

    function clearSearchInput() {
      var input = document.getElementById('searchInput');
      if (!input) return;
      input.value = '';
      input.focus();
      toggleClearBtn(false);
      searchSelectedIndex = -1;
      document.getElementById('searchResults').innerHTML = getSearchInitialHtml();
    }

    function loadSearchIndex() {
      if (searchIndex) return Promise.resolve(searchIndex);
      return fetch('{{ "/search.json" | relative_url }}')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          searchIndex = data;
          return data;
        })
        .catch(function(err) {
          console.error('加载搜索索引失败', err);
          return [];
        });
    }

    // 空闲时静默预加载全站索引，确保打开搜索时零延迟
    if (window.requestIdleCallback) {
      requestIdleCallback(function() { loadSearchIndex(); });
    } else {
      setTimeout(loadSearchIndex, 1000);
    }

    function openSearchModal() {
      var modal = document.getElementById('searchModal');
      var input = document.getElementById('searchInput');
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      input.value = '';
      toggleClearBtn(false);
      searchSelectedIndex = -1;
      document.getElementById('searchResults').innerHTML = getSearchInitialHtml();
      setTimeout(function() { input.focus(); }, 50);
      loadSearchIndex();
    }

    function closeSearchModal() {
      var modal = document.getElementById('searchModal');
      if (modal) modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function handleSearchBackdropClick(e) {
      if (e.target.id === 'searchModal') {
        closeSearchModal();
      }
    }

    window.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault();
        var modal = document.getElementById('searchModal');
        if (modal && modal.classList.contains('active')) closeSearchModal();
        else openSearchModal();
      } else if (e.key === 'Escape') {
        closeSearchModal();
      }
    });

    function getSnippet(content, summary, keyword) {
      var text = summary || content || '';
      if (!keyword) return text;
      var words = keyword.trim().toLowerCase().split(/\s+/).filter(Boolean);
      if (words.length === 0) return text;

      // 优先看 summary 里是否已包含任一关键词
      var sLower = (summary || '').toLowerCase();
      var inSummary = words.some(function(w) { return sLower.indexOf(w) !== -1; });
      if (inSummary && summary) {
        return summary;
      }

      // 否则在 content 中查找首个命中的关键词位置并截取动态上下文片段
      var cText = content || summary || '';
      var cLower = cText.toLowerCase();
      var firstIdx = -1;
      var matchedWordLen = 0;

      for (var i = 0; i < words.length; i++) {
        var idx = cLower.indexOf(words[i]);
        if (idx !== -1 && (firstIdx === -1 || idx < firstIdx)) {
          firstIdx = idx;
          matchedWordLen = words[i].length;
        }
      }

      if (firstIdx !== -1) {
        var start = Math.max(0, firstIdx - 35);
        var end = Math.min(cText.length, firstIdx + matchedWordLen + 65);
        var snippet = cText.substring(start, end).trim();
        if (start > 0) snippet = '...' + snippet;
        if (end < cText.length) snippet = snippet + '...';
        return snippet;
      }

      return summary || cText.substring(0, 100);
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    function highlightKeyword(text, keyword) {
      if (!text) return '';
      var escaped = escapeHtml(text);
      if (!keyword) return escaped;
      var words = keyword.trim().split(/\s+/).filter(Boolean);
      if (words.length === 0) return escaped;
      var pattern = words.map(function(w) {
        return escapeHtml(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }).join('|');
      var reg = new RegExp('(' + pattern + ')', 'gi');
      return escaped.replace(reg, '<mark>$1</mark>');
    }

    function performSearch(query) {
      var resultsBox = document.getElementById('searchResults');
      query = (query || '').trim();
      if (!query) {
        toggleClearBtn(false);
        resultsBox.innerHTML = getSearchInitialHtml();
        return;
      }
      toggleClearBtn(true);
      var qLower = query.toLowerCase();
      var keywords = qLower.split(/\s+/).filter(Boolean);

      loadSearchIndex().then(function(items) {
        var scoredItems = [];

        items.forEach(function(item) {
          var tLower = (item.title || '').toLowerCase();
          var sLower = (item.summary || '').toLowerCase();
          var cLower = (item.content || '').toLowerCase();
          var catLower = (item.category || '').toLowerCase();

          // 基础匹配：必须所有分词都出现在 (title + summary + content + category) 中
          var fullText = tLower + ' ' + sLower + ' ' + cLower + ' ' + catLower;
          var matchAll = keywords.every(function(kw) {
            return fullText.indexOf(kw) !== -1;
          });

          if (!matchAll) return;

          // 计算相关度得分进行排序（标题全匹配 > 标题包含 > 分类 > 摘要 > 正文全文）
          var score = 0;
          if (tLower === qLower) score += 200;
          if (tLower.indexOf(qLower) !== -1) score += 100;
          if (catLower.indexOf(qLower) !== -1) score += 50;
          if (sLower.indexOf(qLower) !== -1) score += 40;
          if (cLower.indexOf(qLower) !== -1) score += 15;

          // 额外分词加权
          keywords.forEach(function(kw) {
            if (tLower.indexOf(kw) !== -1) score += 30;
            if (sLower.indexOf(kw) !== -1) score += 15;
            if (cLower.indexOf(kw) !== -1) score += 5;
          });

          scoredItems.push({
            item: item,
            score: score
          });
        });

        scoredItems.sort(function(a, b) {
          return b.score - a.score;
        });

        var matches = scoredItems.slice(0, 10).map(function(wrapper) {
          return wrapper.item;
        });

        if (matches.length === 0) {
          resultsBox.innerHTML = '<div class="search-empty-tip">' +
            '<p>未找到与 “<strong>' + escapeHtml(query) + '</strong>” 相关的资源</p>' +
            '<p style="font-size: 12px; margin-top: 8px; color: var(--color-muted);">💡 建议尝试：凌霄、飞控、雷达、RDK、SLAM、FAST-LIO、指纹、演示稿</p>' +
            '</div>';
          return;
        }

        searchSelectedIndex = 0;
        var html = '';
        matches.forEach(function(item, idx) {
          var highlightedTitle = highlightKeyword(item.title, query);
          var snippet = getSnippet(item.content, item.summary, query);
          var highlightedSummary = highlightKeyword(snippet, query);
          html += '<a href="' + item.url + '" class="search-result-item ' + (idx === 0 ? 'selected' : '') + '" data-index="' + idx + '">';
          html += '  <div class="search-item-header">';
          html += '    <span class="search-item-title">' + highlightedTitle + '</span>';
          html += '    <span class="search-item-cat">' + escapeHtml(item.category || '综合') + '</span>';
          html += '  </div>';
          html += '  <div class="search-item-summary">' + highlightedSummary + '</div>';
          html += '</a>';
        });
        resultsBox.innerHTML = html;
      });
    }

    function updateSelectedSearchItem(items) {
      items.forEach(function(it, idx) {
        if (idx === searchSelectedIndex) {
          it.classList.add('selected');
          it.scrollIntoView({ block: 'nearest' });
        } else {
          it.classList.remove('selected');
        }
      });
    }

    function bindSearchEvents() {
      var input = document.getElementById('searchInput');
      if (!input) return;

      input.addEventListener('input', function(e) {
        performSearch(e.target.value);
      });

      input.addEventListener('compositionend', function(e) {
        performSearch(e.target.value);
      });

      input.addEventListener('keydown', function(e) {
        var items = document.querySelectorAll('.search-result-item');
        if (items.length === 0) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          searchSelectedIndex = (searchSelectedIndex + 1) % items.length;
          updateSelectedSearchItem(items);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          searchSelectedIndex = (searchSelectedIndex - 1 + items.length) % items.length;
          updateSelectedSearchItem(items);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (searchSelectedIndex >= 0 && searchSelectedIndex < items.length) {
            items[searchSelectedIndex].click();
          }
        }
      });

      // 点击搜索结果条目时自动关闭弹窗（适配同页锚点跳转）
      var resultsBox = document.getElementById('searchResults');
      if (resultsBox) {
        resultsBox.addEventListener('click', function(e) {
          if (e.target.closest('.search-result-item')) {
            closeSearchModal();
          }
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bindSearchEvents);
    } else {
      bindSearchEvents();
    }
  </script>

<!-- ===== 2026-10-02 体验增强（TOC/进度条/上下篇/返回顶部/灯箱/复制/筛选/typed） ===== -->
<div id="lightbox-overlay"><img alt="预览大图"></div>
<script>
(function(){
  var path = location.pathname.replace(/\.html$/, '').replace(/\/$/, '');
  var isDocs = path.indexOf('/docs/') === 0;

  /* 返回顶部（全站） */
  /* 灯箱（.card-media 与正文大图） */
  var lb = document.getElementById('lightbox-overlay'), lbImg = lb.querySelector('img');
  document.addEventListener('click', function(e){
    var t = e.target;
    if (t.matches('.card-media img, .content-inner img[src*="assets"]')) {
      if (t.closest('a')) return;
      lbImg.src = t.src; lb.style.display = 'flex'; e.preventDefault();

  });

  /* 文档页：目录 + 上下篇（进度条/回到顶部/复制沿用 9.27 旧版） */
  if (isDocs) {
    var heads = Array.prototype.slice.call(document.querySelectorAll('.content-inner h2, .content-inner h3'));
    if (heads.length) {
      var toc = document.createElement('nav'); toc.id = 'doc-toc';
      var title = document.createElement('div');
      title.className = 'toc-title';
      title.textContent = '📑 本文目录';
      toc.appendChild(title);

      heads.forEach(function(h){
        if (!h.id) h.id = 'h-' + h.textContent.trim().slice(0, 24);
        var a = document.createElement('a');
        a.href = '#' + h.id; a.textContent = h.textContent.trim();
        if (h.tagName === 'H3') a.className = 'lv3';
        toc.appendChild(a);
      });
      (document.querySelector('.content-body-wrap') || document.querySelector('main')).appendChild(toc);
      window.addEventListener('scroll', function(){
        var cur = null;
        heads.forEach(function(h){ if (h.getBoundingClientRect().top < 120) cur = h.id; });
        toc.querySelectorAll('a').forEach(function(a){ a.classList.toggle('active', a.getAttribute('href') === '#' + cur); });
      });
    }

    var ORDER = [
      ['/docs/security_system', '地瓜派 RDK X5 多模态智能安防系统'],
      ['/docs/unitree_l1', '宇树 L1 + FAST-LIO2 建图方案'],
      ['/docs/leishen_n10p', '镭神 N10P + SLAM Toolbox 方案'],
      ['/docs/rpi4_deploy', '树莓派 4B 部署调优']
    ];
    var idx = ORDER.findIndex(function(o){ return path === o[0]; });
    if (idx >= 0) {
      var nav = document.createElement('div');
      nav.style.cssText = 'display:flex;justify-content:space-between;gap:12px;margin:34px 0 6px';
      function mk(dir, href, txt){
        var a = document.createElement('a');
        a.href = href; a.style.cssText = 'font-size:14px;color:#00ff88;text-decoration:none;border:1px solid rgba(0,255,136,.3);padding:10px 14px;border-radius:10px';
        a.textContent = (dir < 0 ? '← 上一篇：' : '下一篇：') + txt;
        if (dir > 0) nav.appendChild(a); else nav.insertBefore(a, nav.firstChild);
      }
      if (idx > 0) mk(-1, ORDER[idx-1][0], ORDER[idx-1][1]);
      if (idx < ORDER.length-1) mk(1, ORDER[idx+1][0], ORDER[idx+1][1]);
      document.querySelector('.content-inner').appendChild(nav);
    }
  }

  /* projects 页：标签筛选 */
  if (path === '/projects') {
    var bar = document.getElementById('project-filter');
    var cards = document.querySelectorAll('.card[data-tags]');
    if (bar && cards.length) {
      var tags = new Set();
      cards.forEach(function(c){ c.dataset.tags.split(/\s+/).forEach(function(t){ if (t) tags.add(t); }); });
      function mkBtn(txt, val){
        var b = document.createElement('button');
        b.className = 'filter-btn' + (val === '' ? ' active' : ''); b.textContent = txt;
        b.addEventListener('click', function(){
          bar.querySelectorAll('.filter-btn').forEach(function(x){ x.classList.remove('active'); });
          b.classList.add('active');
          cards.forEach(function(c){
            c.style.display = (val === '' || c.dataset.tags.indexOf(val) >= 0) ? '' : 'none';
          });
          document.querySelectorAll('.project-group').forEach(function(g){
            var any = Array.from(g.querySelectorAll('.card[data-tags]')).some(function(c){ return c.style.display !== 'none'; });
            g.style.display = any ? '' : 'none';
          });
        });
        bar.appendChild(b);
      }
      mkBtn('全部', '');
      Array.from(tags).forEach(function(t){ mkBtn(t, t); });
    }
  }

})();
</script>
</body>
