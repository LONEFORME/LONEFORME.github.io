name: 每日新闻与财经更新

on:
  schedule:
    - cron: '0 0 * * *'    # 北京时间 08:00 (UTC 00:00) - 每日早盘前更新
    - cron: '0 7 * * 1-5'  # 北京时间 15:00 (UTC 07:00) - 工作日A股收盘后更新
  workflow_dispatch:       # 手动触发

permissions:
  contents: write

# 防止两次定时任务或手动触发同时运行产生 git push 冲突
concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成新闻与财经摘要
        run: python scripts/news_digest.py

      - name: 提交更新
        run: |
          git config user.name "news-digest[bot]"
          git config user.email "news-digest@loneforme.github.io"
          git add news.md finance.md archive/
          git diff --cached --quiet || git commit -m "自动更新新闻与财经摘要 $(date +'%Y-%m-%d')"
          git push
