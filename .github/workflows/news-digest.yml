name: 每日新闻与财经更新

on:
  schedule:
    - cron: '0 2 * * *'    # 北京时间 10:00 (UTC 02:00) - 上午要闻更新（晨间要闻全面出炉）
    - cron: '30 7 * * *'   # 北京时间 15:30 (UTC 07:30) - 下午收盘更新（A股收盘行情+下午动态）
    - cron: '30 12 * * *'  # 北京时间 20:30 (UTC 12:30) - 晚间黄金档更新（全天要闻汇总+欧美动态）
  workflow_dispatch:       # 手动触发

permissions:
  contents: write

# 防止两次定时任务或手动触发同时运行产生 git push 冲突
concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成新闻与财经摘要
        run: python scripts/news_digest.py

      - name: 提交更新
        run: |
          git config user.name "news-digest[bot]"
          git config user.email "news-digest@loneforme.github.io"
          git add news.md finance.md archive/ requirements.txt
          NOW_BJ=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
          if ! git diff --cached --quiet; then
            git commit -m "自动更新新闻与财经摘要 ${NOW_BJ}"
            git pull --rebase origin main || true
            git push origin main || (sleep 3 && git pull --rebase origin main && git push origin main)
          fi
