name: 每日新闻摘要

on:
  schedule:
    - cron: '0 0 * * *'    # 北京时间 08:00 (UTC 00:00)
  workflow_dispatch:       # 手动触发

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install feedparser requests

      - name: 生成新闻摘要
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: python scripts/news_digest.py

      - name: 提交更新
        run: |
          git config user.name "news-digest[bot]"
          git config user.email "news-digest@loneforme.github.io"
          git add news.md finance.md archive/
          git diff --cached --quiet || git commit -m "自动更新新闻与财经摘要 $(date +'%Y-%m-%d')"
          git push
